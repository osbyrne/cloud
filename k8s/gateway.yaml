apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: contact-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class # Change this according to your Gateway controller (e.g. standard-gateway-class)
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: contact-route
  namespace: default
spec:
  parentRefs:
    - name: contact-gateway
  rules:
    - backendRefs:
        - name: contact-manager-svc
          port: 80
